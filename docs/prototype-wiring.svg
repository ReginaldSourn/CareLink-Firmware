<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #17202a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #52606d; }
      .box-title { font-size: 21px; font-weight: 700; }
      .label { font-size: 16px; }
      .small { font-size: 14px; fill: #52606d; }
      .board { fill: #eef7f0; stroke: #27764a; stroke-width: 3; }
      .module { fill: #f7f9fc; stroke: #66788a; stroke-width: 2; }
      .data { fill: none; stroke: #2563eb; stroke-width: 4; }
      .power { fill: none; stroke: #dc2626; stroke-width: 4; }
      .ground { fill: none; stroke: #27313a; stroke-width: 4; }
      .rf { fill: none; stroke: #d97706; stroke-width: 5; }
      .port { fill: #fff; stroke: #52606d; stroke-width: 2; }
    </style>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="50" y="55" class="title">CareLink Heltec V4 prototype wiring</text>
  <text x="50" y="83" class="subtitle">Dedicated IMU bus • onboard OLED/SX1262 • active-low SOS • transistor-driven passive piezo</text>

  <rect x="430" y="120" width="500" height="650" rx="25" class="board"/>
  <text x="680" y="160" text-anchor="middle" class="box-title">Heltec WiFi LoRa 32 V4</text>
  <text x="680" y="186" text-anchor="middle" class="small">Select the exact V4.2 R2, V4.3.1 R2, or V4 R8 firmware profile</text>

  <rect x="560" y="218" width="240" height="76" rx="12" class="module"/>
  <text x="680" y="248" text-anchor="middle" class="box-title">Onboard OLED</text>
  <text x="680" y="274" text-anchor="middle" class="small">GPIO17 SDA • GPIO18 SCL • GPIO21 RST</text>

  <rect x="560" y="320" width="240" height="82" rx="12" class="module"/>
  <text x="680" y="352" text-anchor="middle" class="box-title">Onboard SX1262</text>
  <text x="680" y="378" text-anchor="middle" class="small">Do not jumper its SPI or FEM pins</text>

  <circle cx="930" cy="245" r="7" class="port"/>
  <text x="915" y="238" text-anchor="end" class="label">GNSS socket</text>
  <circle cx="930" cy="470" r="7" class="port"/>
  <text x="915" y="464" text-anchor="end" class="label">Ve, J2-3/4</text>
  <circle cx="930" cy="515" r="7" class="port"/>
  <text x="915" y="509" text-anchor="end" class="label">GND, J2-1</text>
  <circle cx="930" cy="560" r="7" class="port"/>
  <text x="915" y="554" text-anchor="end" class="label">GPIO47, J2-13</text>
  <circle cx="930" cy="605" r="7" class="port"/>
  <text x="915" y="599" text-anchor="end" class="label">GPIO48, J2-14</text>

  <circle cx="430" cy="595" r="7" class="port"/>
  <text x="445" y="589" class="label">GPIO4, J3-15</text>
  <circle cx="430" cy="655" r="7" class="port"/>
  <text x="445" y="649" class="label">GND, J3-1</text>
  <circle cx="430" cy="420" r="7" class="port"/>
  <text x="445" y="414" class="label">GPIO6, J3-17</text>
  <circle cx="430" cy="465" r="7" class="port"/>
  <text x="445" y="459" class="label">3V3, J3-2/3</text>
  <circle cx="430" cy="505" r="7" class="port"/>
  <text x="445" y="499" class="label">GND, J3-1</text>

  <rect x="1050" y="170" width="270" height="150" rx="18" class="module"/>
  <text x="1185" y="207" text-anchor="middle" class="box-title">Heltec L76K GNSS</text>
  <text x="1185" y="238" text-anchor="middle" class="label">Official keyed 8-pin cable</text>
  <text x="1185" y="270" text-anchor="middle" class="small">UART1 RX is GPIO39 at 9600 baud</text>
  <text x="1185" y="294" text-anchor="middle" class="small">RX/PPS are not used by CareLink</text>
  <path d="M937 245 H1050" class="data" marker-end="url(#arrow-blue)"/>

  <rect x="1050" y="390" width="300" height="290" rx="18" class="module"/>
  <text x="1200" y="428" text-anchor="middle" class="box-title">LSM6DSO breakout</text>
  <text x="1200" y="458" text-anchor="middle" class="small">Letter O • 3.3 V I/O • I2C address 0x6A</text>
  <text x="1070" y="477" class="label">VIN/3V3</text>
  <text x="1070" y="522" class="label">GND</text>
  <text x="1070" y="567" class="label">SDA</text>
  <text x="1070" y="612" class="label">SCL</text>
  <text x="1070" y="647" class="small">CS → 3.3 V; SDO/SA0 → GND</text>
  <path d="M937 470 H1050" class="power"/>
  <path d="M937 515 H1050" class="ground"/>
  <path d="M937 560 H1050" class="data" marker-end="url(#arrow-blue)"/>
  <path d="M937 605 H1050" class="data" marker-end="url(#arrow-blue)"/>

  <rect x="80" y="535" width="250" height="160" rx="18" class="module"/>
  <text x="205" y="575" text-anchor="middle" class="box-title">SOS button</text>
  <circle cx="180" cy="620" r="16" fill="#fff" stroke="#27313a" stroke-width="3"/>
  <circle cx="230" cy="620" r="16" fill="#fff" stroke="#27313a" stroke-width="3"/>
  <path d="M193 602 L218 582" stroke="#27313a" stroke-width="4"/>
  <text x="205" y="666" text-anchor="middle" class="small">Normally open • active low • internal pull-up</text>
  <path d="M330 595 H423" class="data"/>
  <path d="M330 655 H423" class="ground"/>

  <rect x="70" y="310" width="280" height="210" rx="18" class="module"/>
  <text x="210" y="348" text-anchor="middle" class="box-title">Passive piezo buzzer</text>
  <text x="210" y="380" text-anchor="middle" class="small">GPIO6 → 1 kΩ → NPN base</text>
  <text x="210" y="405" text-anchor="middle" class="small">100 kΩ base-to-GND pull-down</text>
  <text x="210" y="440" text-anchor="middle" class="small">3V3 → piezo +</text>
  <text x="210" y="465" text-anchor="middle" class="small">piezo − → collector</text>
  <text x="210" y="495" text-anchor="middle" class="small">Emitter → GND • 2.4 kHz PWM</text>
  <path d="M350 420 H423" class="data"/>
  <path d="M350 465 H423" class="power"/>
  <path d="M350 505 H423" class="ground"/>

  <path d="M680 120 V98" class="rf" marker-end="url(#arrow-orange)"/>
  <path d="M650 98 Q680 64 710 98" fill="none" stroke="#d97706" stroke-width="5"/>
  <text x="745" y="103" class="label">Band-matched LoRa antenna</text>

  <rect x="585" y="705" width="190" height="46" rx="10" fill="#e8eef5" stroke="#66788a" stroke-width="2"/>
  <text x="680" y="734" text-anchor="middle" class="label">USB-C: first power/flash</text>

  <line x1="70" y1="812" x2="125" y2="812" class="power"/>
  <text x="140" y="818" class="label">3.3 V / switched Vext power</text>
  <line x1="350" y1="812" x2="405" y2="812" class="ground"/>
  <text x="420" y="818" class="label">Ground</text>
  <line x1="560" y1="812" x2="615" y2="812" class="data"/>
  <text x="630" y="818" class="label">GPIO / data</text>
  <line x1="790" y1="812" x2="845" y2="812" class="rf"/>
  <text x="860" y="818" class="label">RF antenna path</text>
  <text x="70" y="860" class="subtitle">Attach the antenna before radio TX. Do not apply 5 V to GPIO. Rolork gateway is wireless—not wired to this board.</text>
</svg>
